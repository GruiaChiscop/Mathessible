[package]
name = "mathessible-mathcat"
version = "0.1.0"
edition = "2024"

[lib]
name = "mathessible_mathcat"
crate-type = ["cdylib"]

[dependencies]
mathcat = { path = "../../MathCAT", features = ["include-zip"] }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py312"] }

[build-dependencies]
# liblouis (the submodule) is compiled in by build.rs.
cc = "1"

[profile.release]
lto = true
strip = true

