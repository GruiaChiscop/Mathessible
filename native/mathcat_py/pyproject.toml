[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "matex-mathcat"
version = "0.1.0"
description = "Python bindings used by MateX for MathCAT"
requires-python = ">=3.12,<3.15"

[tool.maturin]
module-name = "matex_mathcat"
bindings = "pyo3"
features = ["pyo3/extension-module"]


[tool.uv]
# uv only rebuilds a path dependency when these change; without the Rust
# sources here, `uv run` silently reinstalls a stale cached wheel.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    # The MathCAT submodule is compiled in, rules included (include-zip).
    { file = "../../MathCAT/Cargo.toml" },
    { file = "../../MathCAT/src/**/*.rs" },
    { file = "../../MathCAT/Rules/**/*.yaml" },
]
