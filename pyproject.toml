[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "matex"
version = "0.1.0"
description = "Prototip de editor matematic accesibil"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "GPL-2.0-or-later" }
dependencies = [
    "markdown-it-py>=3,<5",
    "matex-mathcat",
    "prismatoid>=0.16,<0.17",
    "wxPython>=4.2.3",
]

[project.scripts]
matex = "matex.app:main"
matex-fetch-symbols = "matex.symbol_download:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
matex-mathcat = { path = "native/mathcat_py" }
