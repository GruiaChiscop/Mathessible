[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mathessible"
version = "0.1.0"
description = "A prototype accessible maths editor: UnicodeMath equations in Markdown, read through MathCAT"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "GPL-2.0-or-later" }
dependencies = [
    "markdown-it-py>=3,<5",
    "mathessible-mathcat",
    "prismatoid>=0.16,<0.17",
    "wxPython>=4.2.3",
]

[project.scripts]
mathessible = "mathessible.app:main"
mathessible-fetch-symbols = "mathessible.symbols.download:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.uv.sources]
mathessible-mathcat = { path = "native/mathcat_py" }

# Lint and format: `uv run ruff check` and `uv run ruff format`.
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["MathCAT", "UnicodeMathML", "native/mathcat_py/target", ".tools", ".uv-cache"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # bugbear: likely bugs
    "I",    # import order
    "UP",   # newer Python syntax
    "SIM",  # simpler code
    "C4",   # comprehensions
    "PIE",
    "RET",
    "PERF",
]
ignore = [
    "E501",    # long lines: the formatter wraps code; long strings and comments are left alone
    "SIM105",  # try/except/pass with a comment saying why reads better than contextlib.suppress
]

[tool.ruff.lint.isort]
known-first-party = ["mathessible", "converter_harness"]
