# Pushing a tag like v0.1.0 builds the packaged applications and publishes them as a GitHub release, its
# notes that version's section of CHANGELOG.md. Run by hand, it only builds them, as artifacts to try.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS-arm64
          - os: windows-latest
            name: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare on macOS
        if: runner.os == 'macOS'
        run: |
          brew install python@3.14
          CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" scripts/bootstrap.sh
      - name: Prepare on Windows
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File scripts\bootstrap.ps1
      - name: Package
        run: |
          uv pip install "pyinstaller>=6.16"
          uv run --no-sync pyinstaller packaging/mathessible.spec --noconfirm
      - name: Compress on macOS
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Mathessible.app "Mathessible-${{ matrix.name }}.zip"
      - name: Compress on Windows
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\Mathessible -DestinationPath "Mathessible-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Mathessible-${{ matrix.name }}
          path: Mathessible-${{ matrix.name }}.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The section of this version: from its heading to the next one.
          awk -v version="${TAG#v}" '
            /^## / { found = index($0, "[" version "]") > 0; next }
            found
          ' CHANGELOG.md > notes.md
          gh release create "$TAG" packages/*.zip --title "Mathessible ${TAG#v}" --notes-file notes.md
